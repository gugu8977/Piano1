<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>동요 리듬 놀이</title>
<style>
  [hidden]{display:none!important}
  body{margin:0;font-family:sans-serif;background:#fff7e6;color:#333;text-align:center;user-select:none;-webkit-user-select:none;
       height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  h1{margin:8px 0 2px;font-size:22px}
  .row{margin:4px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  select,button{font-size:16px;padding:6px 10px;border-radius:12px;border:2px solid #f0a040;background:#fff}
  #top{display:flex;align-items:center;justify-content:center;gap:12px}
  #face{font-size:48px;line-height:1.1}
  #msg{font-size:18px;font-weight:bold}
  #stage{flex:1;min-height:0;width:100%;max-width:900px;margin:0 auto;padding:0 8px 8px;box-sizing:border-box;display:flex;flex-direction:column}
  canvas{display:block;flex:1 1 0;min-height:0;width:100%;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 2px 8px #0002}
  #piano{position:relative;display:flex;height:min(170px,35vh);flex-shrink:0;touch-action:none}
  .hint{color:#888;font-size:14px;margin:4px}
  /* 가로 화면(폰): 제목·안내 숨기고 위쪽을 작게 */
  @media (max-height:500px){
    h1,.hint{display:none}
    .row{gap:4px;margin:3px}
    #face{font-size:26px} #msg{font-size:15px}
    #top>div{display:flex;gap:12px;align-items:center}
    select,button{font-size:13px;padding:3px 6px;border-radius:10px}
    .panel .grid{grid-template-columns:repeat(4,auto);gap:6px 10px}
    .mkHelp{display:none} #mkNotes{font-size:14px}
  }
  .w{flex:1;background:#fff;border:1px solid #999;border-radius:0 0 10px 10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:bold;font-size:16px;box-sizing:border-box}
  .b{position:absolute;top:0;width:7%;height:60%;background:#222;border-radius:0 0 6px 6px;z-index:2}
  .w.hint{background:linear-gradient(#fff 30%, var(--c))}
  .w.on{background:#ffd27a}.b.on{background:#666}
  .b.hint{background:linear-gradient(#222 30%, #ff8c42)}
  #hit{width:min(170px,32vh);height:min(170px,32vh);flex-shrink:0;border-radius:50%;font-size:28px;font-weight:bold;background:#ff8c42;color:#fff;border:none;margin:8px auto;display:block;touch-action:none}
  #hit.on{transform:scale(.93);background:#ff6b1a}
  #stage{position:relative}
  /* 설정·결과 창: 게임 화면 위에 덮어서 표시 */
  .panel{position:absolute;inset:0 8px 8px;background:#fff7e6;border-radius:16px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:auto}
  .grid{display:grid;grid-template-columns:auto auto;gap:8px 12px;align-items:center;text-align:left;font-weight:bold}
  #rStars{font-size:44px;animation:pop .5s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  #face.bounce{animation:pop .3s}
  .conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:20;animation:fall 2s linear forwards}
  @keyframes fall{to{transform:translateY(calc(100vh + 60px)) rotate(360deg)}}
  #maker{bottom:calc(min(170px,35vh) + 8px);gap:4px}
  #mkName,#mkNotes{font-size:16px;padding:4px 8px;border-radius:8px;border:2px solid #f0a040;font-family:inherit}
  #mkNotes{width:92%;max-width:640px;box-sizing:border-box}
  /* 길게 누를 때 복사/메뉴 팝업 방지 */
  body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #progress{height:5px;background:#ffe0b3;border-radius:3px;overflow:hidden;flex-shrink:0;margin-bottom:2px}
  #progress>div{height:100%;width:0;background:#ff8c42}
</style>
</head>
<body>
<h1>🎵 동요 리듬 놀이</h1>
<div class="row">
  <select id="song"></select>
  <button id="setBtn">⚙ 설정</button>
  <button id="listen">👀 보고 듣기</button>
  <button id="start">▶ 시작</button>
  <button id="pause" disabled>⏸ 멈춤</button>
  <button id="reset">⏹ 처음</button>
</div>
<div id="top"><div id="face">😺</div><div><div id="msg">시작을 누르고 내려오는 건반을 쳐요!</div><span>점수: <b id="score">0</b> · 🏆 최고: <b id="best">0</b>%</span></div></div>
<div id="stage">
  <div id="progress"><div></div></div>
  <canvas id="cv" width="720" height="260"></canvas>
  <div id="settings" class="panel" hidden>
    <div class="grid">
      <span>빠르기</span><select id="speed"><option value=".75">🐢 느리게</option><option value="1" selected>🚶 보통</option><option value="1.25">🐇 빠르게</option></select>
      <span>놀이 방법</span><select id="mode"><option value="play">🎮 박자 게임</option><option value="learn">🐣 기다려 주기</option></select>
      <span>악기</span><select id="inst"><option value="piano">🎹 피아노</option><option value="xylo">🔔 실로폰</option><option value="box">🎶 오르골</option><option value="drum">🥁 드럼</option></select>
      <span>건반 글자</span><select id="label"><option value="ko">도레미</option><option value="en">CDE</option><option value="none">글자 없음</option></select>
      <span>판정</span><select id="judge"><option value="1.5">😊 너그럽게</option><option value="1" selected>🙂 보통</option><option value="0.7">😎 정확하게</option></select>
      <span>타이밍 보정</span><select id="lat"><option value="0" selected>0ms</option><option value="0.05">+50ms</option><option value="0.1">+100ms</option><option value="0.15">+150ms</option><option value="0.25">+250ms (블루투스)</option></select>
      <span>박자 소리</span><button id="metro">🥁 박자 켬</button>
    </div>
    <div class="row"><button id="mkOpen">✏️ 내 노래 만들기</button><button id="setClose">✔ 닫기</button></div>
  </div>
  <div id="maker" class="panel" hidden>
    <div class="row"><b>✏️ 내 노래</b><input id="mkName" placeholder="노래 이름" maxlength="20">
      <button id="mkTry">👂 듣기</button><button id="mkRest">𝄽 쉼</button><button id="mkBack">⌫ 한 음 지우기</button><button id="mkSave">💾 저장</button><button id="mkDel">🗑 삭제</button><button id="mkClose">닫기</button></div>
    <textarea id="mkNotes" rows="2" placeholder="아래 건반을 누르거나 직접 적어요. 예) 도 도 솔 솔 라 라 솔2"></textarea>
    <small class="mkHelp">길게 칠 음은 뒤에 박자 수(2, 3, .5)를 붙여요. 높은 도는 '높은도', 반음은 '시♭', 쉬는 박자는 '쉼'</small>
    <div id="mkMsg" style="color:#e03131;font-weight:bold"></div>
  </div>
  <div id="result" class="panel" hidden>
    <div id="rStars"></div>
    <div id="rText" style="font-size:20px;font-weight:bold"></div>
    <div id="rCounts"></div>
    <div class="row"><button id="again">🔁 다시 하기</button><button id="next">⏭ 다음 곡</button><button id="rClose">닫기</button></div>
  </div>
  <div id="piano"></div>
  <button id="hit" hidden>톡!</button>
</div>
<p class="hint">키보드: A S D F G H J K = 도~높은도, W E T Y U = 검은건반 (드럼은 스페이스바)</p>

<script>
// 곡 데이터 (모두 저작권이 끝난 전래/고전 곡): 음이름(c=높은 도, 뒤에 #/b는 반음, R=쉼표) + 박자수(생략시 1, .5=반박)
const SONGS = {
  // lv: 1 쉬움, 2 보통, 3 어려움 / m: 한 마디 박자 수(기본 4)
  "뜨거운 빵":         {lv:1, bpm:90,  n:"E D C2 E D C2 C.5 C.5 C.5 C.5 D.5 D.5 D.5 D.5 E D C2"},
  "비행기":            {lv:1, bpm:100, n:"E D C D E E E2 D D D2 E G G2 E D C D E E E E D D E D C2"},
  "반짝반짝 작은별":   {lv:1, bpm:90,  n:"C C G G A A G2 F F E E D D C2 G G F F E E D2 G G F F E E D2 C C G G A A G2 F F E E D D C2"},
  "나비야":            {lv:1, bpm:100, n:"G E E2 F D D2 C D E F G G G2 G E E E F D D D C E G G E E E2"},
  "런던 다리":         {lv:2, bpm:100, n:"G A G F E F G2 D E F2 E F G2 G A G F E F G2 D2 G E C2"},
  "환희의 송가":       {lv:2, bpm:100, n:"E E F G G F E D C C D E E1.5 D.5 D2 E E F G G F E D C C D E D1.5 C.5 C2"},
  "성자의 행진":       {lv:2, bpm:110, n:"C E F G4 C E F G4 C E F G2 E2 C2 E2 D4 E E D C3 C E G G F3 E F G2 E2 C2 D2 C4"},
  "맥도날드 농장":     {lv:2, bpm:110, n:"G G G D E E D2 B B A A G3 D G G G D E E D2 B B A A G3"},
  "생일 축하 노래":    {lv:2, bpm:100, m:3, n:"C.5 C.5 D C F E2 C.5 C.5 D C G F2 C.5 C.5 c A F E D Bb.5 Bb.5 A F G F2"},
  "징글벨":            {lv:3, bpm:110, n:"E E E2 E E E2 E G C1.5 D.5 E4 F F F1.5 F.5 F E E E.5 E.5 E D D E D2 G2"},
  "아침 종소리":       {lv:3, bpm:100, n:"C D E C C D E C E F G2 E F G2 G.5 A.5 G.5 F.5 E C G.5 A.5 G.5 F.5 E C C G C2 C G C2"}
};
const LEAD = 4;
let BEAT = .6;
const song = () => SONGS[$('song').value];
const setTempo = () => BEAT = 60 / (song().bpm * +$('speed').value);
const JUDGE = () => +$('judge').value, LAT = () => +$('lat').value;
const meter = () => song().m || 4; // 한 마디 박자 수
const KEYS = ['C','D','E','F','G','A','B','c'];
const NAMES = ['도','레','미','파','솔','라','시','도'];
const FREQ = [261.63,293.66,329.63,349.23,392,440,493.88,523.25];
const COLORS = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#748ffc','#da77f2','#ff6b6b'];
const BLACK = [[0,277.18],[1,311.13],[3,369.99],[4,415.3],[5,466.16]]; // [왼쪽 흰건반 번호, 주파수]
const KB = 'asdfghjk', KB_B = 'wetyu'; // PC 키보드: 흰건반 / 검은건반
const BNAMES = {ko: ['레♭','미♭','솔♭','라♭','시♭'], en: ['Db','Eb','Gb','Ab','Bb']};
// 음이름 → 건반 번호 (흰건반 0~7, 검은건반 8~12, 없는 음은 -1)
function keyOf(letter, acc){
  const w = KEYS.indexOf(letter);
  if (!acc || w < 0) return w;
  const i = BLACK.findIndex(b => b[0] === (acc === '#' ? w : w - 1));
  return i < 0 ? -1 : 8 + i;
}
const freqOf = k => k < 8 ? FREQ[k] : BLACK[k - 8][1];
const colorOf = k => k < 8 ? COLORS[k] : '#495057';

const $ = id => document.getElementById(id);
const LV = ["", "🟢 쉬움", "🟡 보통", "🔴 어려움", "✏️ 내 노래"];
// 내 노래(부모님이 직접 만든 곡)는 기기에 저장, lv 4로 목록에 추가
const loadMine = () => { try { return JSON.parse(localStorage.getItem('mysongs') || '{}'); } catch { return {}; } };
function buildSongList(sel){
  for (const k in SONGS) if (SONGS[k].lv === 4) delete SONGS[k];
  for (const [n, s] of Object.entries(loadMine())) if (!SONGS[n]) SONGS[n] = {lv: 4, bpm: 90, n: s};
  const keep = sel || $('song').value; $('song').innerHTML = '';
  for (let lv = 1; lv <= 4; lv++) {
    const g = document.createElement('optgroup'); g.label = LV[lv];
    for (const [n, s] of Object.entries(SONGS)) if (s.lv === lv) g.append(new Option(n, n));
    if (g.children.length) $('song').append(g);
  }
  if (SONGS[keep]) $('song').value = keep;
}
buildSongList();
const starsOf = p => p >= 85 ? '⭐⭐⭐' : p >= 60 ? '⭐⭐' : p > 0 ? '⭐' : '';
// 곡 목록에 현재 모드의 최고 별 표시
function songStars(){
  for (const o of $('song').options) {
    let p = 0; try { p = +localStorage.getItem(`best:${$('mode').value}:${o.value}`) || 0; } catch {}
    o.textContent = o.value + (p ? ' ' + starsOf(p) : '');
  }
}

let ac, notes = [], t0 = 0, playing = false, paused = false, score = 0, combo = 0;
let fx = [], laneHit = {k: 0, at: -1e9}; // 판정 글자 효과, 마지막으로 누른 줄

// 게임 시계. '기다려 주기' 모드에서는 다음 음이 판정선에 닿으면 시계를 붙잡아 둠
let offset = 0;
const learn = () => $('mode').value === 'learn';
function clock(){
  let now = ac.currentTime - offset;
  const n = learn() && !auto && notes.find(n => !n.judged);
  if (n) { const t = t0 + n.beat * BEAT; if (now > t) { offset += now - t; now = t; } }
  return now;
}

// 최고 기록 (곡별, 기기에 저장)
const bestKey = () => `best:${$('mode').value}:${$('song').value}`;
const getBest = () => { try { return +localStorage.getItem(bestKey()) || 0; } catch { return 0; } };
const showBest = () => { $('best').textContent = getBest(); songStars(); };
$('song').onchange = $('mode').onchange = showBest; showBest();
const isDrum = () => $('inst').value === 'drum';
function audio(){
  if (!ac) {
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createDynamicsCompressor(); master.connect(ac.destination); // 소리가 겹쳐도 찢어지지 않게
  }
  if (!paused) ac.resume(); return ac;
}
let master, demoBus, auto = false; // demoBus: 시범 연주 소리 묶음(끊을 때 한 번에 끊음)

// 멈춤: 오디오 시계(currentTime)를 정지시키면 음표·박자도 그대로 멈춤
$('pause').onclick = () => {
  paused = !paused;
  paused ? ac.suspend() : ac.resume();
  $('pause').textContent = paused ? '▶ 계속' : '⏸ 멈춤';
  $('listen').disabled = paused;
  paused ? react('😴', '잠깐 쉬는 중~') : react('😺', '다시 시작!');
};
// 완전 정지 + 리셋: 오디오를 닫아 예약된 소리(준비 박자, 듣기)까지 모두 끊음
$('reset').onclick = () => {
  if (ac) { ac.close(); ac = null; }
  playing = paused = auto = false; score = 0; combo = 0; notes = []; fx = [];
  $('score').textContent = 0;
  $('pause').textContent = '⏸ 멈춤'; $('pause').disabled = true; $('listen').disabled = false;
  cx.clearRect(0, 0, cv.width, cv.height);
  $('settings').hidden = $('result').hidden = $('maker').hidden = true; $('progress').firstChild.style.width = 0; clearHints();
  react('😺', '시작을 누르고 내려오는 건반을 쳐요!');
};
// 앱/탭이 화면에서 사라지면 자동 멈춤
document.addEventListener('visibilitychange', () => { if (document.hidden && playing && !paused) $('pause').onclick(); });

function parse(str){ // 쉼표(R)는 박자만 흐르고 음표는 만들지 않음
  let beat = 0;
  return str.split(' ').map(tok => {
    if (tok[0] === 'R') { beat += +tok.slice(1) || 1; return null; }
    const acc = /^[#b]$/.test(tok[1] || '') ? tok[1] : '';
    const k = keyOf(tok[0], acc), len = +tok.slice(1 + acc.length) || 1;
    const n = {k, beat, len, judged:false};
    beat += len; return n;
  }).filter(Boolean);
}

// ---------- 소리 ----------
// 악기 음색: [배음 배수, 파형, 크기] 목록 + 울림 길이(초)
const TONES = {
  piano: {p: [[1, 'triangle', .3], [2, 'sine', .08], [3, 'sine', .03]], d: .9},
  xylo:  {p: [[1, 'sine', .35], [4, 'sine', .07], [10, 'sine', .02]], d: .45},
  box:   {p: [[2, 'sine', .2], [6, 'sine', .05], [4.01, 'sine', .04]], d: 1.4}
};
function piano(f, when, dest){
  const a = audio(), t = when || a.currentTime, tone = TONES[$('inst').value] || TONES.piano;
  tone.p.forEach(([m, type, v]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f * m;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .005); // 딸깍 소리 방지
    g.gain.exponentialRampToValueAtTime(.001, t + tone.d);
    o.connect(g).connect(dest || master); o.start(t); o.stop(t + tone.d);
  });
}
function drum(when, high, dest){
  const a = audio(), t = when || a.currentTime; dest = dest || master;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(high ? 300 : 150, t);
  o.frequency.exponentialRampToValueAtTime(50, t + .15);
  g.gain.setValueAtTime(.8, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
  o.connect(g).connect(dest); o.start(t); o.stop(t + .25);
  const buf = a.createBuffer(1, a.sampleRate * .1, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = a.createBufferSource(), sg = a.createGain();
  s.buffer = buf; sg.gain.value = high ? .3 : .1;
  s.connect(sg).connect(dest); s.start(t);
}
// 박자 드럼: 마디 첫 박은 '쿵'(킥), 나머지는 '칙'(하이햇). 모든 소리는 metroGain을 거쳐 켬/끔 가능
let metroOn = true, metroGain;
function beatDrum(when, strong){
  const a = ac, t = when;
  if (strong) {
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
    g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(g).connect(metroGain); o.start(t); o.stop(t + .2);
  }
  const buf = a.createBuffer(1, a.sampleRate * .05, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = strong ? .12 : .08;
  s.connect(f).connect(g).connect(metroGain); s.start(t);
}
$('metro').onclick = () => {
  metroOn = !metroOn;
  $('metro').textContent = metroOn ? '🥁 박자 켬' : '🔇 박자 끔';
  if (metroGain) metroGain.gain.value = metroOn ? 1 : 0;
};

function tick(when){
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.frequency.value = 1000; g.gain.setValueAtTime(.15, when); g.gain.exponentialRampToValueAtTime(.001, when+.05);
  o.connect(g).connect(master); o.start(when); o.stop(when+.05);
}

// ---------- 건반 만들기 ----------
const whiteEls = KEYS.map((_, i) => {
  const el = document.createElement('div');
  el.className = 'w'; el.textContent = NAMES[i]; el.style.setProperty('--c', COLORS[i]); el.style.borderTop = `8px solid ${COLORS[i]}`;
  el.onpointerdown = e => { e.preventDefault(); press(el, i); };
  $('piano').append(el); return el;
});
const blackEls = BLACK.map(([i], j) => {
  const el = document.createElement('div');
  el.className = 'b'; el.style.left = `calc(${(i + 1) / 8 * 100}% - 3.5%)`;
  el.onpointerdown = e => { e.preventDefault(); press(el, 8 + j); };
  $('piano').append(el); return el;
});
const keyEls = [...whiteEls, ...blackEls];
$('hit').onpointerdown = e => { e.preventDefault(); press($('hit'), -1); };

function flash(el){ el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 120); }

// 건반 글자: 도레미 / CDE / 없음
const LABELS = {ko: NAMES, en: ['C','D','E','F','G','A','B','C'], none: Array(8).fill('')};
const lab = () => LABELS[$('label').value];
const labelOf = k => k < 8 ? lab()[k] : $('label').value === 'none' ? '' : BNAMES[$('label').value][k - 8];
const updateLabels = () => whiteEls.forEach((el, i) => el.textContent = lab()[i]);

// 설정 저장/불러오기 (기기에 저장, 실패해도 무시)
const SAVE = ['song', 'speed', 'mode', 'inst', 'label', 'judge', 'lat'];
try {
  const s = JSON.parse(localStorage.getItem('settings') || '{}');
  SAVE.forEach(id => { if (s[id] != null && [...$(id).options].some(o => o.value === s[id])) $(id).value = s[id]; });
  if (s.metroOn === false) $('metro').onclick();
} catch {}
function saveSettings(){
  try { const s = {metroOn}; SAVE.forEach(id => s[id] = $(id).value); localStorage.setItem('settings', JSON.stringify(s)); } catch {}
}
SAVE.forEach(id => $(id).addEventListener('change', saveSettings));
$('metro').addEventListener('click', saveSettings);
$('label').addEventListener('change', updateLabels);

// 설정 창 (게임 중 열면 자동 멈춤)
$('setBtn').onclick = () => { if (playing && !paused) $('pause').onclick(); $('result').hidden = true; $('settings').hidden = false; };
$('setClose').onclick = () => $('settings').hidden = true;
// ---------- 내 노래 만들기 ----------
const KO = {'도':'C','레':'D','미':'E','파':'F','솔':'G','라':'A','시':'B','높은도':'c','쉼':'R'};
const toKo = s => s.split(' ').map(t => {
  const acc = /^[#b]$/.test(t[1] || '') ? t[1] : '';
  return (Object.keys(KO).find(k => KO[k] === t[0]) || t[0]) + ({'#': '♯', b: '♭'}[acc] || '') + t.slice(1 + acc.length);
}).join(' ');
function toNotes(text){ // "도 레2 높은도.5" → "C D2 c.5" (잘못된 글자는 throw)
  const out = text.trim().split(/[\s,]+/).filter(Boolean).map(tok => {
    const m = tok.match(/^(높은도|도|레|미|파|솔|라|시|쉼|[A-G]|c|R)([#b♯♭]?)(\d*\.?\d*)$/);
    if (!m || (m[3] && !(+m[3] > 0))) throw tok;
    const L = KO[m[1]] || m[1], acc = {'♯': '#', '♭': 'b'}[m[2]] || m[2];
    if (L === 'R' ? acc : keyOf(L, acc) < 0) throw tok; // 건반에 없는 음 (예: 미♯)
    return L + acc + m[3];
  });
  if (!out.some(t => t[0] !== 'R')) throw ''; // 쉼표만 있으면 안 됨
  return out.join(' ');
}
function mkRead(){
  try { return toNotes($('mkNotes').value); }
  catch (bad) { $('mkMsg').textContent = bad ? `"${bad}" 를 알 수 없어요` : '계이름을 적어 주세요'; return null; }
}
$('mkOpen').onclick = () => {
  if (playing) $('reset').onclick();
  const s = song(); $('settings').hidden = true; $('maker').hidden = false; $('mkMsg').textContent = '';
  $('mkName').value = s.lv === 4 ? $('song').value : ''; $('mkNotes').value = s.lv === 4 ? toKo(s.n) : '';
};
$('mkClose').onclick = () => $('maker').hidden = true;
$('mkRest').onclick = () => { const t = $('mkNotes'); t.value = (t.value.trim() + ' 쉼').trim(); };
$('mkBack').onclick = () => { const t = $('mkNotes'); t.value = t.value.trim().split(/\s+/).slice(0, -1).join(' '); };
$('mkTry').onclick = () => {
  const n = mkRead(); if (!n) return; $('mkMsg').textContent = '';
  const a = audio(), s = a.currentTime + .2;
  parse(n).forEach(x => { piano(freqOf(x.k), s + x.beat * .6); });
};
$('mkSave').onclick = () => {
  const name = $('mkName').value.trim(), n = mkRead(); if (!n) return;
  if (!name) return $('mkMsg').textContent = '노래 이름을 적어 주세요';
  if (SONGS[name] && SONGS[name].lv !== 4) return $('mkMsg').textContent = '이미 있는 곡 이름이에요';
  const mine = loadMine(); mine[name] = n;
  try { localStorage.setItem('mysongs', JSON.stringify(mine)); } catch {}
  buildSongList(name); showBest(); saveSettings(); $('maker').hidden = true;
  react('😺', `"${name}" 저장! 시작을 눌러 보세요`);
};
$('mkDel').onclick = () => {
  const name = $('mkName').value.trim(), mine = loadMine();
  if (!mine[name]) return $('mkMsg').textContent = '지울 내 노래 이름을 적어 주세요';
  if (!confirm(`"${name}" 을(를) 지울까요?`)) return;
  delete mine[name]; try { localStorage.setItem('mysongs', JSON.stringify(mine)); } catch {}
  buildSongList(); showBest(); saveSettings(); $('maker').hidden = true;
};

addEventListener('contextmenu', e => e.preventDefault());
window.handleBack = () => {
  for (const id of ['maker', 'settings', 'result']) if (!$(id).hidden) { $(id).hidden = true; return true; }
  if (playing && !paused) { $('pause').onclick(); return true; }
  if (playing) { $('reset').onclick(); return true; }
  return false;
};
// 결과 창 버튼
$('again').onclick = () => $('start').onclick();
$('next').onclick = () => { const s = $('song'); s.selectedIndex = (s.selectedIndex + 1) % s.options.length; showBest(); saveSettings(); $('start').onclick(); };
$('rClose').onclick = () => $('result').hidden = true;

$('inst').onchange = () => { $('piano').hidden = isDrum(); $('hit').hidden = !isDrum(); fit(); };

addEventListener('keydown', e => {
  if (e.repeat || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; // 글자 입력 중엔 건반 아님
  if (isDrum() && e.code === 'Space') { e.preventDefault(); press($('hit'), -1); }
  const i = KB.indexOf(e.key.toLowerCase()), j = KB_B.indexOf(e.key.toLowerCase());
  if (!isDrum() && i >= 0) press(whiteEls[i], i);
  if (!isDrum() && j >= 0) press(blackEls[j], 8 + j);
});

// ---------- 게임 ----------
$('listen').onclick = () => begin(true);
$('start').onclick = () => begin(false);
// 게임 시작. isAuto=true면 시범 연주(정해진 시간에 저절로 치고, 점수·기록 없음)
function begin(isAuto){
  auto = isAuto;
  paused = false; $('pause').textContent = '⏸ 멈춤'; $('pause').disabled = false; $('listen').disabled = false;
  $('settings').hidden = $('result').hidden = $('maker').hidden = true;
  const a = audio();
  setTempo();
  notes = parse(song().n);
  t0 = a.currentTime + LEAD * BEAT;
  for (let i = 0; i < LEAD; i++) tick(a.currentTime + i * BEAT);
  // 곡 전체 박자 드럼 미리 예약 (멈춤 시 오디오 시계와 함께 멈춤). 이전 판의 박자는 연결을 끊어 없앰
  if (metroGain) metroGain.disconnect();
  metroGain = a.createGain(); metroGain.gain.value = metroOn ? 1 : 0; metroGain.connect(master);
  const last = notes[notes.length - 1], total = last.beat + last.len;
  if (!learn()) for (let i = 0; i < total; i++) beatDrum(t0 + i * BEAT, i % meter() === 0);
  score = 0; combo = 0; fx = []; offset = 0; playing = true;
  $('score').textContent = 0; react('😺', '준비~ 하나, 둘, 셋, 넷!');
  // 시범 연주: 모든 음을 정확한 시간에 미리 예약
  if (demoBus) demoBus.disconnect();
  demoBus = a.createGain(); demoBus.connect(master);
  if (auto) notes.forEach(n => isDrum() ? drum(t0 + n.beat * BEAT, n.len < 2, demoBus) : piano(freqOf(n.k), t0 + n.beat * BEAT, demoBus));
  if (auto) react('👀', '잘 보고 들어요~');
  cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); // 그리기 반복은 항상 하나만
}
let raf = 0;

function react(face, msg){
  const f = $('face'); f.textContent = face; $('msg').textContent = msg;
  f.classList.remove('bounce'); void f.offsetWidth; f.classList.add('bounce'); // 표정 바뀔 때 통통
}

// key: 누른 흰건반 번호 (드럼은 -1 = 아무 음이나 인정)
function press(el, key){
  if (paused) return;
  flash(el);
  try { navigator.vibrate && navigator.vibrate(15); } catch {}
  if (key >= 0) piano(freqOf(key));
  if (!$('maker').hidden && key >= 0) { const t = $('mkNotes'); t.value = (t.value.trim() + ' ' + (key === 7 ? '높은도' : key < 8 ? NAMES[key] : BNAMES.ko[key - 8])).trim(); return; }
  if (!playing || auto) { if (key < 0) drum(0, true); return; }
  const now = clock() - LAT(), J = JUDGE();
  let best = null, bd = 1e9;
  for (const n of notes) if (!n.judged && (key < 0 || n.k === key)) {
    const d = Math.abs(now - (t0 + n.beat * BEAT));
    if (d < bd) { bd = d; best = n; }
  }
  if (learn()) { // 기다려 주기: 다음 음의 건반을, 판정선 근처(반 박 이내)에서 누르면 통과
    const n = notes.find(n => !n.judged);
    best = n && (key < 0 || n.k === key) && t0 + n.beat * BEAT - now < BEAT * .5 ? n : null; bd = 0;
  }
  if (key < 0) drum(0, !best || best.len < 2);
  laneHit = {k: key, at: performance.now()};
  if (!best || bd > .3 * J) return;
  best.judged = true;
  const c = () => combo >= 3 ? ` 🔥${combo}콤보` : '';
  if (bd < .08 * J)      { score += 100; best.res = 'p'; combo++; react('😻', '최고예요! 💯' + c()); addFx(best, '최고!', '#2f9e44'); }
  else if (bd < .18 * J) { score += 50;  best.res = 'g'; combo++; react('😸', '좋아요! 👍' + c());  addFx(best, '좋아!', '#1c7ed6'); }
  else               {               best.res = 'm'; combo = 0; react('🙀', '조금 아쉬워요');   addFx(best, '아쉬워', '#868e96'); }
  $('score').textContent = score;
}
function addFx(n, txt, color){ fx.push({k: n.k, txt, color, at: performance.now()}); }
function miss(n){
  n.judged = true; n.res = 'm'; combo = 0;
  react('😿', '놓쳤어요~'); addFx(n, '놓침', '#adb5bd');
}

const cv = $('cv'), cx = cv.getContext('2d');
// 캔버스 내부 해상도를 실제 화면 크기에 맞춤 → 글자/블록이 늘어나 보이지 않음
function fit(){
  const d = devicePixelRatio || 1;
  cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit); fit();

function draw(){
  if (!playing) return;
  const now = clock(), W = cv.clientWidth, H = cv.clientHeight, lw = W / 8;
  const HY = H - 12, PX = Math.max(HY / 3.2, 40); // 판정선 y, 1박당 픽셀 (화면에 약 3박이 보이게)
  cx.clearRect(0, 0, W, H);
  // 세로 레인
  for (let i = 1; i < 8; i++) { cx.fillStyle = '#f2f2f2'; cx.fillRect(i * lw, 0, 1, H); }
  // 마디선 (한 마디 = meter박)
  const last = notes[notes.length - 1], total = last.beat + last.len, m = meter();
  cx.fillStyle = '#ffe8cc';
  for (let b = 0; b <= total; b += m) {
    const y = HY - (t0 + b * BEAT - now) / BEAT * PX;
    if (y > 0 && y < HY) cx.fillRect(0, y, W, 2);
  }
  // 진행 막대
  $('progress').firstChild.style.width = Math.max(0, Math.min(100, (now - t0) / (total * BEAT) * 100)) + '%';
  // 판정선
  cx.fillStyle = '#ff8c42'; cx.fillRect(0, HY, W, 5);
  const laneX = k => isDrum() || k < 0 ? W / 2 - lw / 2 : k < 8 ? k * lw : (BLACK[k - 8][0] + .5) * lw;
  // 누른 줄 반짝임
  const pt = performance.now(), la = 1 - (pt - laneHit.at) / 200;
  if (la > 0) {
    const g = cx.createLinearGradient(0, HY, 0, HY - 120);
    g.addColorStop(0, `rgba(255,140,66,${.5 * la})`); g.addColorStop(1, 'rgba(255,140,66,0)');
    cx.fillStyle = g; cx.fillRect(laneX(laneHit.k), HY - 120, lw, 125);
  }
  // 판정 글자 (위로 떠오르며 사라짐)
  fx = fx.filter(f => pt - f.at < 600);
  cx.textAlign = 'center';
  for (const f of fx) {
    const p = (pt - f.at) / 600;
    cx.globalAlpha = 1 - p; cx.fillStyle = f.color;
    cx.font = `bold ${Math.min(20, lw * .4)}px sans-serif`;
    cx.fillText(f.txt, laneX(f.k) + lw / 2, HY - 30 - p * 40);
  }
  cx.globalAlpha = 1;
  // 시작 전 4-3-2-1
  if (now < t0) {
    cx.fillStyle = '#ff8c42'; cx.font = `bold ${Math.min(72, H * .4)}px sans-serif`; cx.textBaseline = 'middle';
    cx.fillText(Math.ceil((t0 - now) / BEAT - 1e-6), W / 2, HY / 2); cx.textBaseline = 'alphabetic';
  }
  let left = 0;
  for (const n of notes) {
    const t = t0 + n.beat * BEAT;
    if (auto && !n.judged && now >= t) { // 시범: 저절로 누름
      n.judged = true; n.res = 'a';
      const el = isDrum() ? $('hit') : keyEls[n.k]; flash(el); laneHit = {k: isDrum() ? -1 : n.k, at: performance.now()};
    }
    if (!auto && !n.judged && now - t > .3 * JUDGE() + LAT()) miss(n);
    if (!n.judged) left++;
    const y = HY - (t - now) / BEAT * PX, h = n.len * PX - 8;
    if (y < 0 || y - h > H) continue;
    const x = laneX(n.k);
    cx.fillStyle = {p:'#8ce99a', g:'#a5d8ff', m:'#ddd'}[n.res] || (isDrum() ? '#ff8c42' : colorOf(n.k));
    if (n.res === 'a') cx.globalAlpha = .5;
    cx.beginPath(); cx.roundRect(x + 6, y - h, lw - 12, h, 10); cx.fill(); cx.globalAlpha = 1;
    if (!n.res && !isDrum()) {
      cx.fillStyle = '#fff'; cx.font = `bold ${Math.min(22, lw * .45)}px sans-serif`; cx.textAlign = 'center';
      cx.fillText(labelOf(n.k), x + lw / 2, y - 10);
    }
  }
  // 다음에 칠 건반을 1박 전부터 빛내기
  const nx = notes.find(n => !n.judged), hk = nx && !isDrum() && t0 + nx.beat * BEAT - now < BEAT ? nx.k : -1;
  keyEls.forEach((el, i) => el.classList.toggle('hint', i === hk));
  if (!left) { clearHints(); return finish(); }
  raf = requestAnimationFrame(draw);
}

function clearHints(){ keyEls.forEach(el => el.classList.remove('hint')); }
function finish(){
  playing = false; $('pause').disabled = true;
  if (auto) { auto = false; return react('😺', '이제 직접 쳐 볼까요? ▶ 시작!'); }
  const pct = Math.round(score / (notes.length * 100) * 100);
  const stars = pct >= 85 ? '⭐⭐⭐' : pct >= 60 ? '⭐⭐' : '⭐';
  const rec = pct > getBest();
  if (rec) try { localStorage.setItem(bestKey(), pct); } catch {}
  showBest();
  react(pct >= 85 ? '🥳' : pct >= 60 ? '😊' : '🤗', `끝! 정확도 ${pct}% ${stars}${rec ? ' 🏆 새 기록!' : ''}`);
  // 결과 창
  const cnt = r => notes.filter(n => n.res === r).length;
  $('rStars').textContent = stars;
  $('rText').textContent = `${$('song').value} · 정확도 ${pct}%${rec ? ' 🏆 새 기록!' : ''}`;
  $('rCounts').textContent = learn() ? `${notes.length}개 음을 모두 쳤어요! 👏`
    : `😻 최고 ${cnt('p')}  ·  😸 좋아 ${cnt('g')}  ·  😿 놓침 ${cnt('m')}`;
  $('result').hidden = false;
  if (pct >= 85) { fanfare(); confetti(); }
}
// 축하 이모지 비
function confetti(){
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span'); s.className = 'conf';
    s.textContent = ['🎉', '⭐', '🎈', '✨', '🎵'][i % 5];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .8 + 's';
    s.style.animationDuration = 1.6 + Math.random() + 's';
    document.body.append(s); setTimeout(() => s.remove(), 3500);
  }
}
// 잘했을 때 짧은 축하 소리 (도-미-솔-도)
function fanfare(){
  const t = audio().currentTime + .1;
  [0, 2, 4, 7].forEach((k, i) => piano(FREQ[k], t + i * .12));
}
// 시작 시 저장된 설정 반영 (모든 정의가 끝난 뒤 실행)
$('inst').onchange(); updateLabels(); showBest();
</script>
</body>
</html>
